<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d4ed8">
<title>正負の数 タイムアタック</title>
<style>
:root{--blue:#1d4ed8;--blue2:#dbeafe;--ink:#172033;--muted:#64748b;--line:#dbe2ea;--bg:#f4f7fb;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{width:min(100%,620px);margin:auto;padding:18px 14px 36px}
header{text-align:center;padding:12px 0 16px}
h1{font-size:clamp(23px,6vw,31px);margin:0 0 5px}
.sub{color:var(--muted);font-size:14px}
.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #0f172a0a}
label{font-weight:700;font-size:14px}
select,button{font:inherit}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:white;margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#f8fafc;border-radius:12px;text-align:center;padding:10px 4px}
.stat strong{display:block;font-size:23px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bestline{font-size:14px;color:var(--muted);margin-top:12px;text-align:center}
.problem{font-size:clamp(32px,9vw,48px);font-weight:750;text-align:center;padding:25px 4px 18px;min-height:100px;font-variant-numeric:tabular-nums}
.answer{font-size:30px;text-align:center;min-height:50px;font-weight:700;letter-spacing:1px;padding:5px}
.answer.empty{color:#94a3b8}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 4px;font-size:22px;font-weight:650;min-height:54px;box-shadow:0 2px 0 #e2e8f0}
.key:active{transform:translateY(1px);box-shadow:none}
.key.primary{background:var(--blue);color:white;border-color:var(--blue)}
.key.soft{background:#eff6ff;color:#1e40af}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.action{border:0;border-radius:12px;padding:13px;font-weight:700;background:#e2e8f0;color:var(--ink)}
.action.start{background:var(--green);color:white}
.action:disabled{opacity:.45}
.feedback{text-align:center;min-height:28px;font-weight:700;padding:8px 0 0}
.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.result{text-align:center}
.result .big{font-size:40px;font-weight:800}
.review-list{font-size:14px;line-height:1.8;padding-left:22px}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}
@media(min-width:480px){main{padding-top:25px}.panel{padding:20px}}
</style>
</head>
<body>
<main>
<header>
<h1>正負の数 タイムアタック</h1>
<div class="sub">30秒で何問正解できるかな？</div>
</header>

<section class="panel">
<label for="level">難易度を選ぶ</label>
<select id="level">
<option value="basic">基本（−5 ～ ＋5）</option>
<option value="standard">標準（−10 ～ ＋10）</option>
<option value="advanced">発展（−20 ～ ＋20）</option>
</select>
<div class="stats">
<div class="stat"><strong id="time">30</strong><span>残り秒数</span></div>
<div class="stat"><strong id="score">0</strong><span>正解数</span></div>
<div class="stat"><strong id="streak">0</strong><span>連続正解</span></div>
</div>
<div class="bestline">この難易度の自己ベスト：<strong id="best">0</strong> 問</div>
</section>

<section class="panel">
<div class="problem" id="problem">スタートを押そう！</div>
<div class="answer empty" id="answer">答えを入力</div>
<div class="keypad" aria-label="数字キー">
<button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
<button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
<button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
<button class="key soft" data-key="minus">マイナス</button><button class="key" data-key="0">0</button><button class="key soft" data-key="back">一文字戻す</button>
</div>
<div class="actions">
<button class="action" id="clear">リセット</button>
<button class="action start" id="submit" disabled>決定</button>
</div>
<div class="feedback" id="feedback" aria-live="polite"></div>
</section>

<section class="panel">
<div class="actions">
<button class="action start" id="start">スタート</button>
<button class="action" id="restart" disabled>もう一度</button>
</div>
<p class="note">スタート後、30秒間の計算に挑戦します。加法・減法がランダムに出題されます。答えを入力して「決定」を押してください。</p>
</section>

<section class="panel result hidden" id="result">
<h2>今回の結果</h2>
<div class="big"><span id="finalScore">0</span>問正解</div>
<p>正答率：<strong id="accuracy">0%</strong>　／　平均回答時間：<strong id="average">--</strong></p>
<p id="bestMessage"></p>
</section>

<section class="panel hidden" id="review">
<h2>まちがえた問題</h2>
<p class="note">もう一度確認してみましょう。</p>
<ol class="review-list" id="reviewList"></ol>
</section>

<footer>自己ベストは、この端末・ブラウザに保存されます。</footer>
</main>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const ranges = {basic:5, standard:10, advanced:20};
let running=false, finished=true, timeLeft=30, score=0, attempts=0, streak=0;
let current=null, input="", startedAt=0, answerTimes=[], mistakes=[], timerId=null;
let questionStartedAt=0;
const bestKey = "signedNumberTimeAttackBest_v1";

function readBests(){try{return JSON.parse(localStorage.getItem(bestKey)||"{}")}catch(e){return {}}}
function saveBest(level,value){const b=readBests();b[level]=Math.max(Number(b[level]||0),value);localStorage.setItem(bestKey,JSON.stringify(b))}
function level(){return $("level").value}
function updateBest(){const b=readBests();$("best").textContent=Number(b[level()]||0)}
function signed(n){return n<0?"(−"+Math.abs(n)+")":"(＋"+n+")"}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function makeQuestion(){
 const r=ranges[level()], a=randInt(-r,r), b=randInt(-r,r), op=Math.random()<.5?"+":"−";
 return {a,b,op,answer:op==="+"?a+b:a-b};
}
function showQuestion(){
 current=makeQuestion();
 $("problem").textContent=signed(current.a)+"　"+current.op+"　"+signed(current.b);
 input="";renderInput();$("feedback").textContent="";$("feedback").className="feedback";
 questionStartedAt=performance.now();
}
function renderInput(){
 $("answer").textContent=input===""?"答えを入力":input.replace("-","−");
 $("answer").classList.toggle("empty",input==="");
}
function setFeedback(message,kind=""){ $("feedback").textContent=message;$("feedback").className="feedback "+kind; }
function startGame(){
 clearInterval(timerId);running=true;finished=false;timeLeft=30;score=0;attempts=0;streak=0;answerTimes=[];mistakes=[];
 $("time").textContent=timeLeft;$("score").textContent=score;$("streak").textContent=streak;
 $("result").classList.add("hidden");$("review").classList.add("hidden");
 $("start").disabled=true;$("restart").disabled=false;$("submit").disabled=false;$("level").disabled=true;
 startedAt=performance.now();showQuestion();
 timerId=setInterval(()=>{timeLeft--; $("time").textContent=timeLeft;if(timeLeft<=0)endGame()},1000);
}
function submitAnswer(){
 if(!running||input===""||input==="-")return;
 const value=Number(input);
 attempts++;answerTimes.push((performance.now()-questionStartedAt)/1000);
 if(value===current.answer){
  score++;streak++;$("score").textContent=score;$("streak").textContent=streak;
  setFeedback("正解！","good");
 }else{
  streak=0;$("streak").textContent=streak;
  mistakes.push({q:$("problem").textContent,user:value,correct:current.answer});
  setFeedback("ちがいます。正解は "+current.answer+" です","bad");
 }
 if(timeLeft>0)showQuestion();
}
function endGame(){
 if(finished)return;
 finished=true;running=false;clearInterval(timerId);
 $("time").textContent=0;$("start").disabled=false;$("restart").disabled=false;$("submit").disabled=true;$("level").disabled=false;
 const rate=attempts?Math.round(score/attempts*100):0;
 const avg=answerTimes.length?(answerTimes.reduce((a,b)=>a+b,0)/answerTimes.length).toFixed(1)+"秒":"--";
 $("finalScore").textContent=score;$("accuracy").textContent=rate+"%";$("average").textContent=avg;
 const old=Number(readBests()[level()]||0);saveBest(level(),score);updateBest();
 $("bestMessage").textContent=score>old?"自己ベスト更新！": "自己ベスト："+Math.max(old,score)+"問";
 $("result").classList.remove("hidden");
 if(mistakes.length){$("reviewList").innerHTML="";mistakes.forEach(m=>{const li=document.createElement("li");li.textContent=m.q+" ＝ "+m.correct+"（あなたの答え："+m.user+"）";$("reviewList").appendChild(li)});$("review").classList.remove("hidden")}
 $("problem").textContent="タイムアップ！";
 input="";renderInput();
}
function clearInput(){input="";renderInput()}
function press(key){
 if(!running)return;
 if(key==="minus"){
  if(input==="")input="-";
  else if(input==="-")input="";
  else input=input.startsWith("-")?input.slice(1):"-"+input;
 }else if(key==="back"){input=input.slice(0,-1)}
 else if(input.length<4){input+=key}
 renderInput();
}
document.querySelectorAll("[data-key]").forEach(btn=>btn.addEventListener("click",()=>press(btn.dataset.key)));
$("clear").addEventListener("click",clearInput);
$("submit").addEventListener("click",submitAnswer);
$("start").addEventListener("click",startGame);
$("restart").addEventListener("click",startGame);
$("level").addEventListener("change",updateBest);
document.addEventListener("keydown",e=>{
 if(e.key>="0"&&e.key<="9")press(e.key);
 else if(e.key==="-"||e.key==="_")press("minus");
 else if(e.key==="Backspace")press("back");
 else if(e.key==="Enter")submitAnswer();
});
updateBest();
})();
</script>
</body>
</html>
